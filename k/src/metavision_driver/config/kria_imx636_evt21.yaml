/**:
  ros__parameters:
    # Raw transport is intentional: EVT21 is not decoded by event_camera_codecs.
    encoding: "evt21;endianness=legacy;height=720;width=1280"
    frame_id: "imx636"
    serial: ""
    use_multithreading: true
    # Bound the raw callback queue to four camera blocks. When full, the
    # oldest-not-yet-processed input is preserved and the new block is
    # dropped with a counter in the periodic statistics log.
    input_queue_size: 4
    send_queue_size: 4
    event_message_time_threshold: 0.001
    event_message_size_threshold: 262144
    statistics_print_interval: 2.0
    bias_file: ""
    camerainfo_url: ""
    erc_mode: "disabled"
    trail_filter: false
    trigger_in_mode: "disabled"
